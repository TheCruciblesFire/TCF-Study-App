# New-service template. The existing TCF-Study-App Render service is not known to be Blueprint-managed.
# Review the proposed resources before deploying or attaching this file to an existing service.
services:
  - type: web
    name: tcf-study-assistant
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: main
    region: ohio
    plan: 0.5c-512mb
    numInstances: 1
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    disk:
      name: disk
      mountPath: /var/data/tcf
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_MODE
        value: live
      - key: DATA_DIR
        value: /var/data/tcf
      - key: TRUST_PROXY_HOPS
        value: '1'
      - key: EMBED_ORIGINS
        value: https://thecruciblesfire.org https://www.thecruciblesfire.org
      - key: DAILY_BUDGET_USD
        value: '2'
      - key: MONTHLY_BUDGET_USD
        value: '20'
      - key: MAX_TURN_USD
        value: '0.03'
      - key: BIBLE_ID
        value: '9879dbb7cfe39e4d-01'
      - key: TCF_OPENAI_API_KEY
        sync: false
      - key: TCF_BIBLE_API_KEY
        sync: false
