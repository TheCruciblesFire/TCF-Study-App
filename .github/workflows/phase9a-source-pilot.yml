name: Phase 9A offline source pilot

on:
  pull_request:
    paths:
      - .github/workflows/phase9a-source-pilot.yml
      - scripts/phase9a-source-pilot.py

permissions:
  contents: read

jobs:
  source-pilot:
    if: github.head_ref == 'research/phase9a-source-pilot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect pinned verse-source files and existing lexicon shape
        run: python scripts/phase9a-source-pilot.py phase9a-pilot-report.json
      - name: Upload aggregate report only
        uses: actions/upload-artifact@v4
        with:
          name: phase9a-source-pilot-report
          path: phase9a-pilot-report.json
          if-no-files-found: error
          retention-days: 14
